name: Draft release
on:
  push:
    tags: ["v[0-9]*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Validate release version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Match tag to the application version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bun run check:versions
      - name: Require versioned release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: test -s "docs/releases/${RELEASE_TAG#v}.md"

  quality:
    name: Release quality
    needs: version
    uses: ./.github/workflows/quality.yml

  desktop:
    name: Verified installers
    needs: version
    uses: ./.github/workflows/desktop-build.yml

  draft:
    name: Create release draft
    needs: [version, quality, desktop]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-*
          path: artifacts
      - name: Create a draft from this run's installers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          bun scripts/release-artifacts.ts artifacts "$RELEASE_TAG" > "$RUNNER_TEMP/ruf-release-assets.txt"
          mapfile -t assets < "$RUNNER_TEMP/ruf-release-assets.txt"
          for asset in "${assets[@]}"; do
            (cd "$(dirname "$asset")" && sha256sum "$(basename "$asset")")
          done > artifacts/SHA256SUMS
          gh release create "$RELEASE_TAG" "${assets[@]}" \
            artifacts/SHA256SUMS \
            --verify-tag --draft --prerelease --title "Ruf ${RELEASE_TAG#v} Developer Preview" \
            --notes-file "docs/releases/${RELEASE_TAG#v}.md"
