name: Set up the workspace
description: Install the pinned toolchains and locked Bun dependencies.
runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: .bun-version
    - name: Install the repository's Rust toolchain
      shell: bash
      run: |
        rustup toolchain install --no-self-update
        rustup show
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        save-if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        cache-on-failure: true
    - name: Install frontend dependencies
      shell: bash
      run: bun install --frozen-lockfile
