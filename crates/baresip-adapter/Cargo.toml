[package]
name = "baresip-adapter"
description = "Integration boundary for the native baresip engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
default = []
# GTK clipboard only; headless/portable adapter checks do not enable this feature.
desktop = ["dep:gtk"]
native = ["dep:serde_json"]
# Explicit native harness only; never enabled by desktop builds.
native-test-hooks = ["native"]

[dependencies]
quick-xml.workspace = true
phone-core.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18", optional = true }
zbus = { version = "5.19", default-features = false, features = [
  "blocking-api",
  "async-io",
] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
libc.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows-core = "0.62.2"
windows = { version = "0.62.2", features = [
  "Data_Xml_Dom",
  "Foundation",
  "UI_Notifications",
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_System_Registry",
  "Win32_System_WinRT",
  "Win32_UI_Notifications",
] }

[build-dependencies]
cc = { version = "1" }
pkg-config = "0.3"
serde_json = { workspace = true, optional = true }

[lints]
workspace = true
