[workspace]
members = [
  "crates/phone-core",
  "crates/baresip-adapter",
  "apps/desktop/src-tauri",
]
default-members = ["crates/phone-core", "crates/baresip-adapter"]
exclude = ["vendor/glib"]
resolver = "3"

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.100.0"
license = "MIT"

[workspace.dependencies]
quick-xml = "=0.42.0"
libc = "0.2"
rust-i18n = "=4.2.4"
sys-locale = "=0.3.2"
serde_json = "1"
phone-core = { path = "crates/phone-core" }
baresip-adapter = { path = "crates/baresip-adapter" }
serde = { version = "1", features = ["derive"] }
ts-rs = "12"
rusqlite = { version = "0.43.0", features = ["bundled"] }
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

# GTK 0.18 cannot use GLib 0.20. This published 0.18.5 source carries only
# the upstream VariantStrIter soundness backport; see vendor/README.md.
[patch.crates-io]
glib = { path = "vendor/glib" }
